name: Bazel C++ Port

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Bazel C++ tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bazel_args: ""
            test_args: ""
            test_target: "//cpp/tests:all //cpp/reco_io:gpu_video_probe_protocol_tests"
          - os: ubuntu-24.04-arm
            bazel_args: ""
            test_args: ""
            test_target: "//cpp/tests:all //cpp/reco_io:gpu_video_probe_protocol_tests"
          - os: macos-latest
            bazel_args: ""
            test_args: "--test_strategy=standalone"
            test_target: "//cpp/tests:all //cpp/reco_io:gpu_video_probe_protocol_tests"
          - os: windows-latest
            bazel_args: "--cxxopt=/std:c++20 --host_cxxopt=/std:c++20"
            test_args: ""
            test_target: "//cpp/reco_io:gpu_video_probe_protocol_tests //cpp/tests:reco_io_gpu_video_probe_tests //cpp/tests:reco_cli_tests"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # v0.15.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
      - name: Test C++ port
        run: bazel test --jobs=2 --local_test_jobs=1 ${{ matrix.test_args }} ${{ matrix.bazel_args }} ${{ matrix.test_target }}
      - name: Build C++ CLI executable
        run: bazel build --jobs=2 --local_test_jobs=1 ${{ matrix.bazel_args }} //cpp/apps/reco_cli:reco
      - name: Build C++ fuzz harnesses
        run: >-
          bazel build --jobs=2 --local_test_jobs=1 ${{ matrix.bazel_args }}
          //cpp/reco_core:input_path_fuzz
          //cpp/reco_core:calibration_json_fuzz
          //cpp/reco_io/fuzz:gpu_video_probe_request_cbor_fuzz
          //cpp/reco_io/fuzz:gpu_video_probe_response_cbor_fuzz

  sanitizers:
    name: Bazel C++ sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # v0.15.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
      - name: Test C++ port with ASan
        run: >-
          bazel test --jobs=2 --local_test_jobs=1 --config=asan
          //cpp/tests:reco_control_tests
          //cpp/tests:reco_core_data_tests
          //cpp/tests:reco_core_math_events_tests
          //cpp/tests:reco_io_config_tests
          //cpp/tests:reco_autocam_policy_tests
          //cpp/tests:reco_calibrate_data_tests
          //cpp/tests:reco_calibrate_feature_tests
          //cpp/tests:reco_calibrate_sampling_tests
          //cpp/tests:reco_calibrate_pipeline_tests
          //cpp/tests:reco_calibrate_gpu_features_tests
          //cpp/tests:reco_calibrate_stable_media_tests
          //cpp/tests:reco_calibrate_supervisor_tests
          //cpp/tests:reco_calibrate_worker_protocol_tests
          //cpp/tests:reco_cli_tests
          //cpp/tests:reco_io_gpu_video_probe_tests
          //cpp/tests:reco_io_gpu_video_probe_fallback_tests
          //cpp/tests:reco_io_gpu_decode_runtime_tests
          //cpp/tests:reco_io_gstreamer_tests
          //cpp/tests:reco_io_nvmm_cuda_interop_tests
      - name: Fuzz probe CBOR decoders with Clang and ASan
        run: |
          mkdir -p "$RUNNER_TEMP/reco-request-corpus" "$RUNNER_TEMP/reco-response-corpus"
          bazel run --jobs=2 --local_test_jobs=1 \
            --repo_env=CC=clang \
            --config=asan \
            --copt=-fsanitize=fuzzer-no-link \
            --linkopt=-fsanitize=fuzzer \
            --copt=-DFUZZING_BUILD_MODE_UNSAFE_FOR_PRODUCTION \
            //cpp/reco_io/fuzz:gpu_video_probe_request_cbor_fuzz -- \
            "$RUNNER_TEMP/reco-request-corpus" \
            "$GITHUB_WORKSPACE/cpp/reco_io/fuzz/corpus/request" \
            -runs=10000 \
            -max_len=262144 \
            -timeout=10
          bazel run --jobs=2 --local_test_jobs=1 \
            --repo_env=CC=clang \
            --config=asan \
            --copt=-fsanitize=fuzzer-no-link \
            --linkopt=-fsanitize=fuzzer \
            --copt=-DFUZZING_BUILD_MODE_UNSAFE_FOR_PRODUCTION \
            //cpp/reco_io/fuzz:gpu_video_probe_response_cbor_fuzz -- \
            "$RUNNER_TEMP/reco-response-corpus" \
            "$GITHUB_WORKSPACE/cpp/reco_io/fuzz/corpus/response" \
            -runs=10000 \
            -max_len=262144 \
            -timeout=10
      - name: Test C++ port with UBSan
        run: >-
          bazel test --jobs=2 --local_test_jobs=1 --config=ubsan
          //cpp/tests:reco_control_tests
          //cpp/tests:reco_core_data_tests
          //cpp/tests:reco_core_math_events_tests
          //cpp/tests:reco_io_config_tests
          //cpp/tests:reco_autocam_policy_tests
          //cpp/tests:reco_calibrate_data_tests
          //cpp/tests:reco_calibrate_feature_tests
          //cpp/tests:reco_calibrate_sampling_tests
          //cpp/tests:reco_calibrate_pipeline_tests
          //cpp/tests:reco_calibrate_gpu_features_tests
          //cpp/tests:reco_calibrate_stable_media_tests
          //cpp/tests:reco_calibrate_supervisor_tests
          //cpp/tests:reco_calibrate_worker_protocol_tests
          //cpp/tests:reco_cli_tests
          //cpp/tests:reco_io_gpu_video_probe_tests
          //cpp/tests:reco_io_gpu_video_probe_fallback_tests
          //cpp/tests:reco_io_gpu_decode_runtime_tests
          //cpp/tests:reco_io_gstreamer_tests
          //cpp/tests:reco_io_nvmm_cuda_interop_tests
      - name: Test process containment with TSan
        run: >-
          bazel test --jobs=2 --local_test_jobs=1 --config=tsan
          //cpp/tests:reco_cli_tests
          //cpp/tests:reco_calibrate_supervisor_tests
          //cpp/tests:reco_io_gpu_decode_runtime_tests
          //cpp/tests:reco_io_gpu_video_probe_tests
          //cpp/tests:reco_io_gpu_video_probe_fallback_tests
          //cpp/tests:reco_io_nvmm_cuda_interop_tests

  # This job requires a runner whose service cgroup delegates the memory and pids controllers.
  calibration-containment-self-hosted-conditional:
    name: Bazel C++ calibration containment (self-hosted)
    if: vars.RECO_CONTAINMENT_RUNNER_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, delegated-cgroup-v2]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # v0.15.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
      - name: Require full calibration containment lifecycle
        run: >-
          bazel test --jobs=2 --local_test_jobs=1
          --test_env=RECO_REQUIRE_CALIBRATION_CONTAINMENT_TEST=1
          --test_output=errors
          //cpp/tests:reco_calibrate_supervisor_tests

  # This job is intentionally conditional until the repository has a self-hosted NVIDIA runner.
  gpu-calibration-hardware-conditional:
    name: Bazel C++ GPU calibration (hardware-conditional)
    if: vars.RECO_GPU_RUNNER_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, nvidia-gpu, delegated-cgroup-v2]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # v0.15.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Require CUDA calibration execution
        env:
          RECO_REQUIRE_CUDA_TEST: "1"
        run: >-
          bazel test --jobs=2 --local_test_jobs=1
          --test_env=RECO_REQUIRE_CUDA_TEST=1
          //cpp/tests:reco_calibrate_gpu_undistort_tests
          //cpp/tests:reco_calibrate_gpu_sampling_tests
          //cpp/tests:reco_calibrate_gpu_features_tests
          //cpp/tests:reco_calibrate_gpu_features_full_resolution_tests
          //cpp/tests:reco_calibrate_gpu_pipeline_tests
          //cpp/tests:reco_calibrate_gpu_video_parity_tests
      - name: Require Rust/C++ decoded-video calibration parity
        env:
          RECO_REQUIRE_CPP_GPU_VIDEO_PARITY: "1"
        run: >-
          cargo test -p reco-calibrate --features io
          --test cpp_gpu_video_parity -- --nocapture
      - name: Run probe-to-NVDEC calibration smoke
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v jq
          command -v gst-inspect-1.0
          gst-inspect-1.0 nvv4l2decoder >/dev/null
          gst-inspect-1.0 nvvideoconvert >/dev/null

          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i 'testsrc2=size=1920x720:rate=30:duration=2' \
            -filter_complex \
            '[0:v]setpts=PTS+5/TB,split=2[left_src][right_src];[left_src]crop=1280:720:0:0,format=yuv420p[left];[right_src]crop=1280:720:640:0,format=yuv420p[right]' \
            -map '[left]' -c:v libx264 -preset ultrafast -g 30 -bf 0 -movflags +faststart \
            "$work_dir/left.mp4" \
            -map '[right]' -c:v libx264 -preset ultrafast -g 30 -bf 0 -movflags +faststart \
            "$work_dir/right.mp4"
          stream_start="$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=start_time -of default=noprint_wrappers=1:nokey=1 \
            "$work_dir/left.mp4")"
          test "$stream_start" = "5.000000"
          printf '%s\n' \
            '{"width":1280,"height":720,"fx":10000000000.0,"fy":10000000000.0,"cx":640.0,"cy":360.0,"d":[0.0,0.0,0.0,0.0]}' \
            >"$work_dir/profile.json"

          bazel run --jobs=2 --local_test_jobs=1 //cpp/apps/reco_cli:reco -- calibrate \
            "$work_dir/left.mp4" "$work_dir/right.mp4" \
            --left-profile "$work_dir/profile.json" \
            --no-auto-sync \
            --no-auto-imu \
            --frames 3 \
            --akaze-threshold 0.0001 \
            --lowe-ratio 1.0 \
            --detect-x 0.5 \
            --detect-y-min 0.05 \
            --detect-y-max 0.95 \
            --output "$work_dir/match.json"
          jq -e \
            '.left_uniforms.width == 1280 and .right_uniforms.width == 1280 and (.params.cameraAxisOffset | type == "number")' \
            "$work_dir/match.json" >/dev/null
