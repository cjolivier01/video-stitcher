name: Bazel C++ Port

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Bazel C++ tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bazel_args: ""
            test_target: //cpp/tests:all //cpp/reco_io:gpu_video_probe_protocol_tests
          - os: macos-latest
            bazel_args: ""
            test_target: //cpp/tests:all //cpp/reco_io:gpu_video_probe_protocol_tests
          - os: windows-latest
            bazel_args: --cxxopt=/std:c++20 --host_cxxopt=/std:c++20
            test_target: //cpp/reco_io:gpu_video_probe_protocol_tests //cpp/tests:reco_io_gpu_video_probe_tests
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # v0.15.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
      - name: Test C++ port
        run: bazel test ${{ matrix.bazel_args }} ${{ matrix.test_target }}
      - name: Build C++ fuzz harnesses
        run: bazel build ${{ matrix.bazel_args }} //cpp/reco_core:input_path_fuzz //cpp/reco_core:calibration_json_fuzz

  sanitizers:
    name: Bazel C++ sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # v0.15.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
      - name: Test probe and decode runtimes with ASan
        run: bazel test --config=asan //cpp/tests:reco_io_gpu_video_probe_tests //cpp/tests:reco_io_gpu_decode_runtime_tests
      - name: Test probe and decode runtimes with UBSan
        run: bazel test --config=ubsan //cpp/tests:reco_io_gpu_video_probe_tests //cpp/tests:reco_io_gpu_decode_runtime_tests
      - name: Test probe runtime with TSan
        run: bazel test --config=tsan //cpp/tests:reco_io_gpu_video_probe_tests
